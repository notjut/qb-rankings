<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QB Game Rankings</title>
  <meta name="description" content="Every NFL quarterback game, ranked best to worst, era- and defense-adjusted. Updates weekly.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
      "papaparse": "https://esm.sh/papaparse@5.4.1"
    }
  }
  </script>
  <style>
    html, body { margin: 0; background: #0d1b2a; color: #eaf0f7; }
    #boot { padding: 24px 16px; font: 14px system-ui, sans-serif; color: #96a8bf; }
  </style>
</head>
<body>
  <div id="qb-rankings-root"><div id="boot">Loading QB Game Rankings…</div></div>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import Papa from "papaparse";

    // The app lives in qb-game-rankings.jsx (the same file used in the Claude artifact).
    // Fetch it, drop the module import/export lines, compile the JSX in the browser and mount it.
    try {
      const src = await (await fetch("./qb-game-rankings.jsx", { cache: "no-store" })).text();
      const body = src.replace(/^import[^\n]*\n/gm, "").replace("export default function", "function");
      const js = Babel.transform(body, { presets: ["react"], filename: "qb-game-rankings.jsx" }).code;
      const factory = new Function("React", "useState", "useEffect", "useMemo", "useRef", "Papa", js + "\n;return QBGameRankings;");
      const App = factory(React, React.useState, React.useEffect, React.useMemo, React.useRef, Papa);
      createRoot(document.getElementById("qb-rankings-root")).render(React.createElement(App));
    } catch (err) {
      document.getElementById("boot").textContent = "Could not start the app: " + (err && err.message ? err.message : err) +
        ". Open this page through a web server (GitHub Pages or `python -m http.server`), not as a local file.";
      console.error(err);
    }
  </script>
</body>
</html>
